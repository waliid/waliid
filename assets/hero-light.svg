<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Walid Kayhal, Apple engineer building video players for iOS, tvOS and macOS. The name streams in like an adaptive video, from 240p up to 2160p.">
  <defs>
    <filter id="px16" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="960" height="260">
      <feFlood x="8" y="8" width="1" height="1"/><feComposite width="16" height="16"/><feTile result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="8"/>
    </filter>
    <filter id="px11" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="960" height="260">
      <feFlood x="5" y="5" width="1" height="1"/><feComposite width="11" height="11"/><feTile result="g"/>
