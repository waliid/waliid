      <feFlood x="3" y="3" width="1" height="1"/><feComposite width="7" height="7"/><feTile result="g"/>
      <feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="3"/>
    </filter>
