      <feComposite in="SourceGraphic" in2="g" operator="in"/><feMorphology operator="dilate" radius="2"/>
    </filter>
    <filter id="px2" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="960" height="260">
